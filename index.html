<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown until 5,200 miles of yearning collapses into the distance between your mouth and mine</title>
<style>
body{
    margin:0;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#0f172a;
    color:white;
}
.card{
    text-align:center;
    padding:2.5rem 3rem;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    max-width:700px;
}
h1{
    margin:0.4rem 0 1rem;
    line-height:1.2;
}
#countdown{
    font-size:3rem;
    font-weight:700;
    margin:.5rem 0;
}
.small{
    opacity:.8;
}
</style>
</head>
<body>
<div class="card">
    <div class="small">Countdown until</div>
    <h1>5,200 miles of yearning collapses into the distance between your mouth and mine</h1>
    <div id="countdown">Loading...</div>
    <div class="small">Closer...</div>
</div>

<script>
const target = new Date("2026-09-14T12:00:00");

function updateCountdown(){
    const now = new Date();
    let diff = target - now;

    if(diff <= 0){
        document.getElementById("countdown").textContent = "Mission accomplished.";
        return;
    }

    const days = Math.floor(diff/(1000*60*60*24));
    diff %= (1000*60*60*24);
    const hours = Math.floor(diff/(1000*60*60));
    diff %= (1000*60*60);
    const minutes = Math.floor(diff/(1000*60));
    diff %= (1000*60);
    const seconds = Math.floor(diff/1000);

    document.getElementById("countdown").textContent =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
